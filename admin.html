<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SoCal Cleanup — Admin Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --green-dark: #1a5c1a;
    --green-mid: #2a8c2a;
    --gold: #f5a623;
    --gold-light: #ffd166;
    --black: #0d0d0d;
    --surface: #161616;
    --surface2: #1e1e1e;
    --border: rgba(255,255,255,0.08);
    --off-white: #f4f4f0;
    --muted: rgba(244,244,240,0.5);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Nunito', sans-serif;
    background: var(--black);
    color: var(--off-white);
    min-height: 100vh;
  }

  /* ── LOGIN ── */
  #loginScreen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: radial-gradient(ellipse at top, rgba(26,92,26,0.3) 0%, transparent 60%);
  }
  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 48px 40px;
    width: 100%;
    max-width: 400px;
    text-align: center;
  }
  .login-logo {
    font-family: 'Oswald', sans-serif;
    font-size: 1.4rem;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .login-logo span { color: var(--gold); }
  .login-sub {
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 32px;
  }
  .login-card input {
    width: 100%;
    padding: 12px 16px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--off-white);
    font-family: 'Nunito', sans-serif;
    font-size: 0.95rem;
    margin-bottom: 12px;
    outline: none;
    transition: border-color 0.2s;
  }
  .login-card input:focus { border-color: var(--gold); }
  .login-btn {
    width: 100%;
    padding: 13px;
    background: var(--gold);
    color: var(--black);
    border: none;
    border-radius: 6px;
    font-family: 'Oswald', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    transition: background 0.2s;
    margin-top: 4px;
  }
  .login-btn:hover { background: var(--gold-light); }
  .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .login-error {
    color: #ff6b6b;
    font-size: 0.85rem;
    margin-top: 12px;
    display: none;
  }

  /* ── DASHBOARD ── */
  #dashboard { display: none; }

  header {
    background: var(--surface);
    border-bottom: 2px solid var(--green-mid);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .header-logo {
    font-family: 'Oswald', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
  }
  .header-logo span { color: var(--gold); }
  .header-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .header-user {
    font-size: 0.82rem;
    color: var(--muted);
  }
  .logout-btn {
    padding: 7px 16px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--off-white);
    font-family: 'Nunito', sans-serif;
    font-size: 0.82rem;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .logout-btn:hover { border-color: var(--gold); color: var(--gold); }

  .dash-content { padding: 28px 24px; max-width: 1200px; margin: 0 auto; }

  /* Stats bar */
  .stats-bar {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 16px;
    margin-bottom: 28px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    text-align: center;
  }
  .stat-num {
    font-family: 'Oswald', sans-serif;
    font-size: 2rem;
    font-weight: 700;
    color: var(--gold);
  }
  .stat-label {
    font-size: 0.78rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 4px;
  }

  /* Controls */
  .controls {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    align-items: center;
  }
  .controls input, .controls select {
    padding: 9px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--off-white);
    font-family: 'Nunito', sans-serif;
    font-size: 0.88rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .controls input { flex: 1; min-width: 200px; }
  .controls input:focus, .controls select:focus { border-color: var(--gold); }
  .controls select option { background: #1e1e1e; }
  .refresh-btn {
    padding: 9px 18px;
    background: var(--green-dark);
    border: 1px solid var(--green-mid);
    border-radius: 6px;
    color: var(--off-white);
    font-family: 'Nunito', sans-serif;
    font-size: 0.88rem;
    cursor: pointer;
    transition: background 0.2s;
    white-space: nowrap;
  }
  .refresh-btn:hover { background: var(--green-mid); }

  /* Leads table */
  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .leads-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.88rem;
  }
  .leads-table th {
    background: var(--surface2);
    padding: 13px 16px;
    text-align: left;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  .leads-table td {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  .leads-table tr:last-child td { border-bottom: none; }
  .leads-table tr:hover td { background: rgba(255,255,255,0.02); }

  .lead-name { font-weight: 700; color: var(--off-white); }
  .lead-phone a { color: var(--gold); text-decoration: none; }
  .lead-phone a:hover { text-decoration: underline; }
  .lead-address { color: var(--muted); font-size: 0.82rem; max-width: 180px; }
  .service-badge {
    display: inline-block;
    padding: 3px 10px;
    background: rgba(42,140,42,0.2);
    border: 1px solid rgba(42,140,42,0.4);
    border-radius: 20px;
    font-size: 0.75rem;
    color: #6ee06e;
    white-space: nowrap;
  }
  .lead-message {
    color: var(--muted);
    font-size: 0.82rem;
    max-width: 200px;
    line-height: 1.4;
  }
  .lead-date { color: var(--muted); font-size: 0.8rem; white-space: nowrap; }

  .photos-cell { display: flex; gap: 6px; flex-wrap: wrap; }
  .photo-thumb {
    width: 52px; height: 52px;
    object-fit: cover;
    border-radius: 5px;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: transform 0.15s;
  }
  .photo-thumb:hover { transform: scale(1.08); }

  .delete-btn {
    padding: 5px 12px;
    background: transparent;
    border: 1px solid rgba(255,107,107,0.3);
    border-radius: 5px;
    color: #ff6b6b;
    font-size: 0.78rem;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .delete-btn:hover { background: rgba(255,107,107,0.1); border-color: #ff6b6b; }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .empty-state .emoji { font-size: 3rem; margin-bottom: 12px; }

  .loading-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }

  /* Photo lightbox */
  #lightbox {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  #lightbox.open { display: flex; }
  #lightbox img {
    max-width: 90vw;
    max-height: 90vh;
    object-fit: contain;
    border-radius: 6px;
  }
  #lightbox .close-x {
    position: absolute;
    top: 20px; right: 28px;
    font-size: 2rem;
    color: white;
    cursor: pointer;
    line-height: 1;
  }

  /* Mobile cards fallback */
  @media (max-width: 700px) {
    .leads-table thead { display: none; }
    .leads-table, .leads-table tbody, .leads-table tr, .leads-table td {
      display: block; width: 100%;
    }
    .leads-table tr {
      border-bottom: 1px solid var(--border);
      padding: 16px;
    }
    .leads-table tr:hover td { background: transparent; }
    .leads-table td {
      border: none; padding: 3px 0;
    }
    .leads-table td::before {
      content: attr(data-label) ': ';
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      font-weight: 700;
    }
    .lead-address, .lead-message { max-width: 100%; }
    .dash-content { padding: 16px; }
    .controls input { min-width: 100%; }
  }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">SoCal <span>Cleanup & Hauling</span></div>
    <p class="login-sub">Admin Dashboard · Sign in to continue</p>
    <input type="email" id="loginEmail" placeholder="Email address" autocomplete="email">
    <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
    <button class="login-btn" id="loginBtn" onclick="handleLogin()">Sign In</button>
    <p class="login-error" id="loginError"></p>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <header>
    <div class="header-logo">SoCal <span>Cleanup</span> · Admin</div>
    <div class="header-right">
      <span class="header-user" id="headerUser"></span>
      <button class="logout-btn" onclick="handleLogout()">Sign Out</button>
    </div>
  </header>

  <div class="dash-content">

    <!-- Stats -->
    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-num" id="statTotal">—</div>
        <div class="stat-label">Total Leads</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statToday">—</div>
        <div class="stat-label">Today</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statWeek">—</div>
        <div class="stat-label">This Week</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statPhotos">—</div>
        <div class="stat-label">With Photos</div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <input type="text" id="searchInput" placeholder="🔍  Search by name, phone, address..." oninput="renderLeads()">
      <select id="serviceFilter" onchange="renderLeads()">
        <option value="">All Services</option>
        <option>Junk / Item Removal</option>
        <option>Garage Cleanout</option>
        <option>Yard & Debris Cleanup</option>
        <option>Furniture Hauling</option>
        <option>Pet Waste Removal</option>
        <option>Moving Cleanup</option>
        <option>Other / Not Sure</option>
      </select>
      <button class="refresh-btn" onclick="loadLeads()">↻ Refresh</button>
    </div>

    <!-- Table -->
    <div class="table-wrap">
      <table class="leads-table" id="leadsTable">
        <thead>
          <tr>
            <th>Name</th>
            <th>Phone</th>
            <th>Address</th>
            <th>Service</th>
            <th>Message</th>
            <th>Photos</th>
            <th>Date</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="leadsBody">
          <tr><td colspan="8"><div class="loading-state">Loading leads...</div></td></tr>
        </tbody>
      </table>
    </div>

  </div>
</div>

<!-- Lightbox -->
<div id="lightbox" onclick="closeLightbox()">
  <span class="close-x">✕</span>
  <img id="lightboxImg" src="" alt="Lead photo">
</div>

<script>
  const SUPABASE_URL     = 'https://tcipkqjvtirudtilkknb.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRjaXBrcWp2dGlydWR0aWxra25iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNzY0ODAsImV4cCI6MjA5NTY1MjQ4MH0.x54OSuQbpjAcFhttSOIHWzbEczqDxUaFP-2b6TDsuNw';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let allLeads = [];

  // ── Auth ─────────────────────────────────────────────────────
  supabase.auth.onAuthStateChange((event, session) => {
    if (session) {
      showDashboard(session.user);
    } else {
      showLogin();
    }
  });

  async function handleLogin() {
    const btn   = document.getElementById('loginBtn');
    const error = document.getElementById('loginError');
    const email = document.getElementById('loginEmail').value.trim();
    const pass  = document.getElementById('loginPassword').value;

    error.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Signing in...';

    const { error: authError } = await supabase.auth.signInWithPassword({ email, password: pass });

    if (authError) {
      error.textContent = 'Invalid email or password. Try again.';
      error.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  }

  // Allow Enter key to submit login
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && document.getElementById('loginScreen').style.display !== 'none') {
      handleLogin();
    }
  });

  async function handleLogout() {
    await supabase.auth.signOut();
  }

  function showLogin() {
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('dashboard').style.display   = 'none';
  }

  function showDashboard(user) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').style.display   = 'block';
    document.getElementById('headerUser').textContent    = user.email;
    loadLeads();
  }

  // ── Leads ─────────────────────────────────────────────────────
  async function loadLeads() {
    document.getElementById('leadsBody').innerHTML =
      '<tr><td colspan="8"><div class="loading-state">Loading leads...</div></td></tr>';

    const { data, error } = await supabase
      .from('leads')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      document.getElementById('leadsBody').innerHTML =
        '<tr><td colspan="8"><div class="empty-state"><div class="emoji">⚠️</div><p>Error loading leads. Try refreshing.</p></div></td></tr>';
      return;
    }

    allLeads = data || [];
    updateStats();
    renderLeads();
  }

  function updateStats() {
    const now   = new Date();
    const today = now.toISOString().slice(0, 10);
    const weekAgo = new Date(now - 7 * 24 * 60 * 60 * 1000).toISOString();

    document.getElementById('statTotal').textContent  = allLeads.length;
    document.getElementById('statToday').textContent  = allLeads.filter(l => l.created_at.startsWith(today)).length;
    document.getElementById('statWeek').textContent   = allLeads.filter(l => l.created_at >= weekAgo).length;
    document.getElementById('statPhotos').textContent = allLeads.filter(l => l.photo_urls && l.photo_urls.length > 0).length;
  }

  function renderLeads() {
    const search  = document.getElementById('searchInput').value.toLowerCase();
    const service = document.getElementById('serviceFilter').value;

    const filtered = allLeads.filter(lead => {
      const matchSearch = !search ||
        (lead.first_name + ' ' + lead.last_name).toLowerCase().includes(search) ||
        (lead.phone || '').toLowerCase().includes(search) ||
        (lead.address || '').toLowerCase().includes(search) ||
        (lead.email || '').toLowerCase().includes(search);
      const matchService = !service || lead.service === service;
      return matchSearch && matchService;
    });

    const tbody = document.getElementById('leadsBody');

    if (filtered.length === 0) {
      tbody.innerHTML = `<tr><td colspan="8"><div class="empty-state">
        <div class="emoji">📭</div>
        <p>${allLeads.length === 0 ? 'No leads yet. Submissions will appear here.' : 'No leads match your search.'}</p>
      </div></td></tr>`;
      return;
    }

    tbody.innerHTML = filtered.map(lead => {
      const name    = [lead.first_name, lead.last_name].filter(Boolean).join(' ');
      const date    = new Date(lead.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      const photos  = (lead.photo_urls || []).map(path => {
        const { data } = supabase.storage.from('lead-photos').getPublicUrl(path);
        // We use a signed URL approach via click instead
        return `<img class="photo-thumb" src="" data-path="${path}" alt="Lead photo" onclick="openPhoto('${path}')" title="Click to view">`;
      }).join('');

      return `<tr>
        <td data-label="Name"><div class="lead-name">${escHtml(name)}</div>${lead.email ? `<div style="font-size:0.78rem;color:var(--muted);margin-top:2px;">${escHtml(lead.email)}</div>` : ''}</td>
        <td data-label="Phone"><div class="lead-phone"><a href="tel:${escHtml(lead.phone)}">${escHtml(lead.phone)}</a></div></td>
        <td data-label="Address"><div class="lead-address">${escHtml(lead.address || '—')}</div></td>
        <td data-label="Service">${lead.service ? `<span class="service-badge">${escHtml(lead.service)}</span>` : '<span style="color:var(--muted)">—</span>'}</td>
        <td data-label="Message"><div class="lead-message">${escHtml(lead.message || '—')}</div></td>
        <td data-label="Photos"><div class="photos-cell">${photos || '<span style="color:var(--muted);font-size:0.8rem;">None</span>'}</div></td>
        <td data-label="Date"><div class="lead-date">${date}</div></td>
        <td><button class="delete-btn" onclick="deleteLead('${lead.id}', '${escHtml(name)}')">Delete</button></td>
      </tr>`;
    }).join('');

    // Load signed URLs for photos
    loadPhotoThumbs();
  }

  async function loadPhotoThumbs() {
    const imgs = document.querySelectorAll('.photo-thumb[data-path]');
    for (const img of imgs) {
      const path = img.getAttribute('data-path');
      const { data, error } = await supabase.storage
        .from('lead-photos')
        .createSignedUrl(path, 3600); // 1 hour
      if (!error && data?.signedUrl) {
        img.src = data.signedUrl;
      }
    }
  }

  async function openPhoto(path) {
    const { data, error } = await supabase.storage
      .from('lead-photos')
      .createSignedUrl(path, 3600);
    if (!error && data?.signedUrl) {
      document.getElementById('lightboxImg').src = data.signedUrl;
      document.getElementById('lightbox').classList.add('open');
    }
  }

  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
    document.getElementById('lightboxImg').src = '';
  }

  async function deleteLead(id, name) {
    if (!confirm(`Delete lead for "${name}"? This cannot be undone.`)) return;

    const { error } = await supabase.from('leads').delete().eq('id', id);
    if (!error) {
      allLeads = allLeads.filter(l => l.id !== id);
      updateStats();
      renderLeads();
    } else {
      alert('Failed to delete. Please try again.');
    }
  }

  function escHtml(str) {
    if (!str) return '';
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
</body>
</html>
